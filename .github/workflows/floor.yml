name: Floor

# Tier 0 floor: a full-history secrets scan, on every repo, regardless of
# language. Do not edit this file in place — it is overwritten by the next
# sweep. The source of truth is
# mriechers/github-actions:scripts/fleet-sweep/stubs/floor.yml.

on: [push, pull_request]

jobs:
  floor:
    permissions:
      contents: read
      pull-requests: write # gitleaks comments findings on PRs
    uses: mriechers/github-actions/.github/workflows/floor.yml@191a3e919bfa22c0c5cf2b85cdab4f4290651237 # v1
