name: Floor

# Tier 0 floor: a secrets scan of the commits a change adds, on every repo,
# regardless of language. It runs on pull requests and on pushes to the default
# branch, so a pull-request commit is scanned once, not twice. Do not edit this
# file in place — it is overwritten by the next sweep. The source of truth is
# mriechers/github-actions:scripts/fleet-sweep/stubs/floor.yml.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  floor:
    permissions:
      contents: read
    uses: mriechers/github-actions/.github/workflows/floor.yml@e38512b2f3e573d63352cc712fd8dcc7b5212f38 # v1
