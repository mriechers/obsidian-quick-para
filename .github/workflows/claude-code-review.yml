name: Claude Code Review

# On demand: a review runs when the `claude-review` label is added to a pull
# request, not when one is opened. Review locally first (`/code-review`) and
# add the label when a pull request deserves a second read. To review again
# after a push, remove the label and add it back.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
      id-token: write
    uses: mriechers/github-actions/.github/workflows/claude-review.yml@e38512b2f3e573d63352cc712fd8dcc7b5212f38 # v1
    with:
      github_app_id: ${{ vars.REVIEW_APP_ID }}
      review_label: claude-review
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      github_app_private_key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
